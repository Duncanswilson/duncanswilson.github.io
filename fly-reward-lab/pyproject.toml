[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-reward-lab"
version = "0.1.0"
description = "Reproducible MaleCNS connectome simulation with idealized neuromodulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.2", "pyarrow>=16"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
live = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
flyreward = "flyreward.cli:main"

[tool.setuptools.packages.find]
include = ["flyreward*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
