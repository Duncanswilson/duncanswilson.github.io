name: fly-reward-lab

x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Only this short-lived initializer runs as root. It owns the application
  # volume for the unprivileged backend and exits before the backend starts.
  state-init:
    image: python:3.12-slim-bookworm
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /state/data /state/live
        chown -R 10001:10001 /state
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - state:/state
    restart: "no"
    logging: *bounded-logging

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: fly-reward-lab:local
    user: "10001:10001"
    init: true
    depends_on:
      state-init:
        condition: service_completed_successfully
    # One process owns one evolving simulation/checkpoint. Do not scale replicas
    # against the same state volume.
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - state:/state
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3))['ready']"]
      interval: 30s
      timeout: 5s
      start_period: 15m
      retries: 3
    logging: *bounded-logging

  caddy:
    image: caddy:2-alpine
    depends_on:
      backend:
        condition: service_started
    environment:
      FLY_API_DOMAIN: ${FLY_API_DOMAIN:?Set FLY_API_DOMAIN to a domain pointing at this VM}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *bounded-logging

volumes:
  state:
  caddy_data:
  caddy_config:
